name: Search reliability
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  insurance-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check:th-search-r1-013
      - run: npm run check:insurance-ask
      - run: npm run check:ins-cap-001
      - run: npm run typecheck
      - run: npm test
