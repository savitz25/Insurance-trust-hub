<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VISUAL-005 — Old Insurance vs New Insurance</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #0A2540; background: #F8FAFC; }
    body { margin: 24px; }
    h1 { font-size: 28px; }
    h2 { font-size: 18px; margin: 32px 0 12px; }
    p { color: #1E293B; max-width: 920px; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    figure { margin: 0; background: #fff; border: 1px solid #E2E8F0; border-radius: 16px; overflow: hidden; }
    figcaption { padding: 10px 12px; font-size: 13px; font-weight: 600; border-top: 1px solid #E2E8F0; }
    img { display: block; width: 100%; }
  </style>
</head>
<body>
  <h1>OLD INSURANCE vs NEW INSURANCE</h1>
  <p>VISUAL-005 network shell. Stacked Ask Network bar removed. Canonical brackets+four-point mark. Shield retained as specialist iconography, not the header logo.</p>
  <h2>Desktop 1440 — header</h2>
  <div class="grid">
    <figure>
      <img src="before/header-desktop.png" alt="Old Insurance stacked chrome" />
      <figcaption>OLD — 57px network bar + 81px product header = 138px stacked</figcaption>
    </figure>
    <figure>
      <img src="after/header-desktop.png" alt="New Insurance desktop header" />
      <figcaption>NEW — 69px one row, 36px canonical mark, Switch Hub 44px</figcaption>
    </figure>
  </div>
  <h2>Desktop 1440 — homepage</h2>
  <div class="grid">
    <figure>
      <img src="before/desktop-1440.jpg" alt="Old Insurance homepage" />
      <figcaption>OLD INSURANCE · 1440</figcaption>
    </figure>
    <figure>
      <img src="after/desktop-1440.jpg" alt="New Insurance homepage" />
      <figcaption>NEW INSURANCE · 1440</figcaption>
    </figure>
  </div>
  <h2>Desktop — Network Navigator</h2>
  <figure>
    <img src="after/desktop-switch.jpg" alt="Insurance Switch Hub open" />
    <figcaption>NEW — ASK TRUST HUB NETWORK · Insurance Current</figcaption>
  </figure>
  <h2>Mobile 390</h2>
  <div class="grid">
    <figure>
      <img src="before/mobile-390.jpg" alt="Old Insurance mobile" />
      <figcaption>OLD · stacked chrome</figcaption>
    </figure>
    <figure>
      <img src="after/mobile-390.jpg" alt="New Insurance mobile" />
      <figcaption>NEW · 57px / 30px mark</figcaption>
    </figure>
  </div>
  <div class="grid">
    <figure>
      <img src="after/mobile-drawer.jpg" alt="Insurance drawer" />
      <figcaption>NEW drawer</figcaption>
    </figure>
    <figure>
      <img src="after/mobile-network.jpg" alt="Insurance network section" />
      <figcaption>NEW network section</figcaption>
    </figure>
  </div>
</body>
</html>
